apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hft-arena

resources:
  - namespace.yaml
  - redis.yaml
  - timescaledb.yaml
  - telemetry.yaml
  - bot-fleet.yaml
  - orchestrator.yaml
  - networkpolicy.yaml

# Defaults to the images built by `docker compose build` (import them into a local
# cluster with `k3d image import`). For a cloud registry, retag/push and change
# newName to e.g. ghcr.io/<you>/hft-arena-orchestrator.
images:
  - name: hft-arena/orchestrator
    newName: hft-arena-orchestrator
    newTag: latest
  - name: hft-arena/telemetry
    newName: hft-arena-telemetry
    newTag: latest
  - name: hft-arena/bot-fleet
    newName: hft-arena-bot_fleet
    newTag: latest

commonLabels:
  app.kubernetes.io/part-of: hft-arena
