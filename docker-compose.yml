# HFT Arena — Distributed Benchmarking & Hosting Platform
# This compose file IS our Infrastructure-as-Code for the single-host vertical slice.
# `deploy.replicas` keys make it Docker Swarm compatible (see docs/ARCHITECTURE.md).
name: hft-arena

services:
  redis:
    image: redis:7-alpine
    container_name: arena-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [arena_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: arena-timescaledb
    environment:
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    volumes:
      - arena_tsdb:/var/lib/postgresql/data
    networks: [arena_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arena"]
      interval: 3s
      timeout: 2s
      retries: 20

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: arena-orchestrator
    ports:
      - "8000:8000"
    volumes:
      # Lets the orchestrator drive the host Docker daemon to sandbox submissions.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REDIS_URL: redis://redis:6379
      ARENA_NETWORK: arena_net
    depends_on:
      redis:
        condition: service_healthy
    networks: [arena_net]

  telemetry:
    build: ./telemetry
    container_name: arena-telemetry
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:arena@timescaledb:5432/arena
      TARGET_TPS: "100000"     # peak TPS that earns the full throughput sub-score
      LAT_REF_US: "2000"       # p99 reference for the latency sub-score (at REF_LOAD)
      REF_LOAD: "10000"        # fixed offered load (ord/s) latency is scored at
    depends_on:
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks: [arena_net]

  bot_fleet:
    build: ./bot_fleet
    environment:
      REDIS_URL: redis://redis:6379
      BOTS_PER_WORKER: "250"   # async bots each replica spawns per run (closed phase)
      SWEEP_RATES: "5000,10000,20000,40000,80000"  # open-loop offered-load sweep (ord/s)
      STEP_SECS: "4"           # seconds per sweep step
      SWEEP_BOTS: "120"        # bot pool size during the sweep
    depends_on:
      redis:
        condition: service_healthy
    networks: [arena_net]
    deploy:
      replicas: 1              # scale with: docker compose up --scale bot_fleet=3

volumes:
  arena_tsdb:                 # TimescaleDB data (run history survives restarts)

networks:
  arena_net:
    name: arena_net           # fixed name so orchestrator-launched sandboxes can join
    driver: bridge
